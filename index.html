   const name=NAMES[lang][i];
   if(query && !(name+" "+c[2].join(" ")).toLowerCase().includes(query))return "";
   return `<article class="cat" onclick="openCategory(${i})"><img src="${I[c[1]][0]}" loading="lazy" alt="${esc(name)}"><div class="shade"><h3>${esc(name)}</h3><span>${T[lang].count} →</span></div></article>`;
 }).join("") || `<p style="color:var(--muted);padding:20px">لا توجد نتائج.</p>`;
}
function openCategory(i){
 const c=base[i],name=NAMES[lang][i],t=T[lang];
 $("modalTitle").textContent=name;
 $("products").innerHTML=c[2].map((p,j)=>`<article class="product"><img src="${I[c[1]][j%2]}" loading="lazy" alt="${esc(p)}"><div class="body"><h3>${esc(p)}</h3><div class="row"><span class="price">${c[3][j]}</span><button class="add" onclick="add(${i},${j})">+ ${t.add}</button></div></div></article>`).join("");
 $("modal").classList.add("show");document.body.classList.add("lock");
}
function closeModal(){$("modal").classList.remove("show");document.body.classList.remove("lock")}
function add(ci,pi){
 cart.push({ci,pi});save();showToast(T[lang].added);renderCart();
}
function save(){localStorage.setItem("cmCart",JSON.stringify(cart));$("count").textContent=cart.length}
function openCart(){renderCart();$("drawer").classList.add("show")}
function closeCart(){$("drawer").classList.remove("show")}
function renderCart(){
 const t=T[lang];
 if(!cart.length){$("cartItems").innerHTML=`<div class="cartempty">${t.empty}</div>`;return}
 $("cartItems").innerHTML=cart.map((x,k)=>{let c=base[x.ci];return `<div class="cartline"><span>${esc(c[2][x.pi])}</span><b>${c[3][x.pi]}</b><button onclick="removeCart(${k})" style="background:none;border:0;color:#f77">×</button></div>`}).join("");
}
function removeCart(k){cart.splice(k,1);save();renderCart()}
function sendOrder(){
 if(!cart.length)return;
 const lines=cart.map(x=>{let c=base[x.ci];return `${c[2][x.pi]} — ${c[3][x.pi]}`}).join("\n");
 // ضع رقم واتساب المتجر هنا بصيغة دولية، مثال: 491234567890
 const WHATSAPP_NUMBER="491234567890";
 const text=encodeURIComponent(`Caesar Markt Neumünster\n\n${lines}\n\n${lang==="ar"?"أرغب في تأكيد الطلب والتوصيل.":"Ich möchte die Bestellung und Lieferung bestätigen."}`);
 window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${text}`,"_blank");
}
function to(id){$(id).scrollIntoView({behavior:"smooth",block:"start"})}
function home(e){if(e)e.preventDefault();window.scrollTo({top:0,behavior:"smooth"})}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function showToast(s){$("toast").textContent=s;$("toast").classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").classList.remove("show"),1800)}
$("lang").addEventListener("change",e=>{lang=e.target.value;localStorage.setItem("cmLang",lang);apply();renderCart()});
$("search").addEventListener("input",e=>renderCats(e.target.value));
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closeCart()}})
apply();
</script>
</body>
</html>
