<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Markt Neumünster | سوبر ماركت دولي</title>
    <meta name="description" content="Caesar Markt Neumünster - سوبر ماركت دولي في قلب Neumünster. تسوق، استلام من المتجر وتوصيل إلى المنزل.">
    <meta name="theme-color" content="#07172b">

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy: #07172b;
            --navy-light: #0c223d;
            --gold: #d7ad55;
            --gold-light: #f1d68d;
            --white: #ffffff;
            --bg-light: #fbfaf7;
            --text: #172235;
            --muted: #6d7684;
            --green: #25d366;
            --danger: #c0392b;
            --radius: 12px;
            --header-height: 95px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Cairo", sans-serif;
            background: var(--bg-light);
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            width: min(1200px, calc(100% - 32px));
            margin: 0 auto;
        }

        /* HEADER & LOGO UPDATED FOR CAESAR BRAND */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            z-index: 1000;
            background: rgba(7, 23, 43, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--gold);
            display: flex;
            align-items: center;
        }

        .header-inner {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-logo {
            width: 75px; /* مقاس مثالي ومميز للشعار */
            height: 75px;
            border-radius: 14px; /* زوايا ناعمة تتناسق مع هيبة التاج */
            object-fit: cover;
            border: 2px solid var(--gold);
            background: var(--navy);
            box-shadow: 0 4px 15px rgba(215, 173, 85, 0.2);
        }

        .brand-text .brand-name {
            color: var(--gold-light);
            font-family: "Montserrat", sans-serif;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .brand-text .brand-city {
            color: #fff;
            font-size: 12px;
            opacity: 0.8;
            font-weight: 600;
        }

        .main-nav a {
            color: #fff;
            margin: 0 12px;
            font-weight: 700;
            font-size: 15px;
            transition: 0.3s;
        }

        .main-nav a:hover {
            color: var(--gold);
        }

        .cart-button {
            position: relative;
            background: var(--gold);
            border: none;
            padding: 12px 18px;
            border-radius: var(--radius);
            font-weight: 700;
            color: var(--navy);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(215, 173, 85, 0.3);
            transition: 0.3s;
        }

        .cart-button:hover {
            transform: translateY(-2px);
            background: var(--gold-light);
        }

        .cart-count {
            background: var(--danger);
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: bold;
        }

        /* HERO SECTION */
        .hero {
            position: relative;
            min-height: 85vh;
            padding-top: var(--header-height);
            background: linear-gradient(rgba(7, 23, 43, 0.85), rgba(7, 23, 43, 0.75)), url("store-hero.jpg") center/cover no-repeat;
            display: flex;
            align-items: center;
            color: white;
            text-align: center;
        }

        .hero-content {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding: 20px;
        }

        .hero-title {
            font-size: clamp(30px, 5vw, 54px);
            line-height: 1.35;
            font-weight: 800;
            color: #fff;
            margin-bottom: 22px;
        }

        .hero-title span {
            color: var(--gold-light);
            text-shadow: 0 2px 10px rgba(215, 173, 85, 0.3);
        }

        .hero-desc {
            font-size: clamp(16px, 2vw, 20px);
            margin-bottom: 35px;
            opacity: 0.95;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border-radius: var(--radius);
            font-weight: 700;
            text-decoration: none;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
        }

        .btn-gold { background: var(--gold); color: var(--navy); box-shadow: 0 4px 15px rgba(215,173,85,0.4); }
        .btn-gold:hover { background: var(--gold-light); transform: translateY(-2px); }
        .btn-whatsapp { background: var(--green); color: white; box-shadow: 0 4px 15px rgba(37,211,102,0.4); }
        .btn-whatsapp:hover { background: #1ebd58; transform: translateY(-2px); }

        /* BANNER */
        .banner {
            background: var(--navy-light);
            color: white;
            text-align: center;
            padding: 16px 20px;
            border-bottom: 3px solid var(--gold);
            font-weight: 700;
            font-size: 16px;
        }

        /* CATEGORIES */
        .sections-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            padding: 60px 0;
        }

        .cat-card {
            background: white;
            border-radius: var(--radius);
            padding: 35px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            border: 1px solid rgba(7, 23, 43, 0.05);
            cursor: pointer;
            transition: 0.3s ease;
        }

        .cat-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold);
            box-shadow: 0 15px 35px rgba(215, 173, 85, 0.15);
        }

        .cat-card h3 { color: var(--navy); font-size: 24px; margin-bottom: 12px; font-weight: 700; }
        .cat-card p { color: var(--muted); font-size: 14px; }

        /* MODAL / CART SYSTEM */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(7, 23, 43, 0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-content {
            background: white;
            padding: 35px;
            border-radius: var(--radius);
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 24px;
            cursor: pointer;
            border: none;
            background: none;
            color: var(--muted);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            color: var(--navy);
            font-size: 14px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(7, 23, 43, 0.15);
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--gold);
        }

        .warning-text {
            color: var(--danger);
            font-weight: bold;
            margin: 12px 0;
            display: none;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .main-nav { display: none; }
            .site-header { height: auto; padding: 12px 0; }
            .brand-logo { width: 60px; height: 60px; }
            .hero { min-height: 70vh; }
        }
    </style>
</head>

                <img src="logo.png" alt="Caesar Markt" class="brand-logo">

                    <span class="brand-name">CAESAR MARKT</span>
                    <span class="brand-city">Neumünster</span>
                </div>
            </div>
            <nav class="main-nav">

                <a href="#store">المتجر</a>
                <a href="#home">من نحن</a>
                <a href="#home">اتصل بنا</a>
            </nav>
