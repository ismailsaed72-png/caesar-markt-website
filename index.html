<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#061321">
<title>Caesar Markt Neumünster</title>

<style>
:root{
  --navy:#061321;
  --navy2:#0b2136;
  --card:rgba(12,35,56,.88);
  --gold:#d5a73f;
  --gold2:#ffe49a;
  --text:#f8fbff;
  --muted:#aebdca;
  --border:rgba(255,226,145,.22);
  --shadow:0 24px 80px rgba(0,0,0,.42);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Segoe UI,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 50% -20%,#1b456c 0,#061321 48%,#030a11 100%);
  overflow-x:hidden;
}

body.no-scroll{
  overflow:hidden;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.container{
  width:min(1240px,92%);
  margin:auto;
}

/* TOP BAR */

.topbar{
  background:linear-gradient(
    90deg,
    #8d641e,
    #f5d273,
    #8d641e
  );
  color:#111;
  text-align:center;
  padding:8px 12px;
  font-weight:bold;
  font-size:13px;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(4,14,24,.84);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.header-inner{
  min-height:82px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  display:flex;
  align-items:center;
  gap:13px;
}

.logo img{
  width:65px;
  height:65px;
  object-fit:contain;
  filter:drop-shadow(
    0 7px 17px rgba(213,167,63,.35)
  );
}

.logo-title{
  font:700 27px Georgia,serif;
  color:var(--gold2);
  letter-spacing:.08em;
}

.logo-sub{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.controls{
  display:flex;
  align-items:center;
  gap:8px;
}

.lang{
  background:#0b263e;
  color:#fff;
  border:1px solid var(--gold);
  padding:9px 11px;
  border-radius:10px;
}

.cart-btn{
  border:1px solid var(--gold);
  background:#0b263e;
  color:#fff;
  border-radius:10px;
  padding:9px 12px;
}

.cart-count{
  display:inline-grid;
  place-items:center;
  min-width:21px;
  height:21px;
  border-radius:50%;
  background:var(--gold2);
  color:#111;
  font-size:12px;
  font-weight:900;
  margin-inline-start:4px;
}

/* NAV */

.nav{
  background:#0a1c2e;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.nav-inner{
  display:flex;
  justify-content:center;
  gap:4px;
  overflow:auto;
  scrollbar-width:none;
}

.nav-inner::-webkit-scrollbar{
  display:none;
}

.nav button{
  white-space:nowrap;
  padding:13px 18px;
  background:none;
  border:0;
  color:#dbe6ef;
  border-bottom:2px solid transparent;
}

.nav button:hover,
.nav button.active{
  color:var(--gold2);
  border-color:var(--gold);
}

/* HERO */

.hero{
  position:relative;
  min-height:680px;
  display:flex;
  align-items:center;
  overflow:hidden;
  border-bottom:1px solid var(--border);
}

.hero-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-3;
  filter:saturate(.82) contrast(1.08);
}

.hero-overlay{
  position:absolute;
  inset:0;
  z-index:-2;

  background:
    linear-gradient(
      90deg,
      rgba(3,11,18,.96) 0%,
      rgba(3,11,18,.76) 43%,
      rgba(3,11,18,.27) 100%
    ),
    linear-gradient(
      0deg,
      rgba(3,10,17,.72),
      transparent 45%,
      rgba(3,10,17,.25)
    );
}

.hero-glow{
  position:absolute;
  width:420px;
  height:420px;
  border-radius:50%;
  background:rgba(213,167,63,.13);
  filter:blur(80px);
  right:8%;
  top:8%;
  z-index:-1;
}

.hero-content{
  padding:92px 0;
  max-width:760px;
}

.eyebrow{
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--gold);
  background:rgba(0,0,0,.2);
  padding:8px 13px;
  border-radius:999px;
  color:var(--gold2);
  font-weight:700;
  font-size:13px;
}

.hero h1{
  font:700 clamp(42px,7vw,82px) Georgia,serif;
  line-height:1.05;
  margin:18px 0 15px;
}

.hero h1 span{
  color:var(--gold2);
}

.hero p{
  font-size:17px;
  line-height:1.9;
  color:#d6e1e9;
  max-width:680px;
}

.hero-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:26px;
}

.btn-primary,
.btn-ghost{
  padding:13px 19px;
  border-radius:11px;
  font-weight:900;
  border:1px solid var(--gold);
}

.btn-primary{
  background:
    linear-gradient(
      135deg,
      var(--gold),
      var(--gold2)
    );
  color:#111;
}

.btn-ghost{
  background:rgba(4,17,29,.66);
  color:#fff;
}

/* FEATURES */

.features{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:-42px;
  position:relative;
  z-index:3;
}

.feature{
  background:rgba(9,30,48,.91);
  border:1px solid var(--border);
  border-radius:15px;
  padding:17px;
  backdrop-filter:blur(12px);
}

.feature b{
  display:block;
  color:var(--gold2);
  margin-bottom:5px;
}

.feature span{
  font-size:12px;
  color:var(--muted);
}

/* CONTENT */

section.content{
  padding:82px 0 0;
}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:20px;
}

.section-head h2{
  font:700 clamp(29px,4vw,42px) Georgia,serif;
  color:var(--gold2);
}

.section-head p{
  color:var(--muted);
  font-size:14px;
}

/* SEARCH */

.search{
  display:flex;
  gap:9px;
  margin-bottom:22px;
}

.search input{
  flex:1;
  background:#0a2238;
  border:1px solid rgba(255,255,255,.12);
  color:#fff;
  border-radius:11px;
  padding:13px 15px;
  outline:none;
}

.search input:focus{
  border-color:var(--gold);
}

/* CATEGORIES */

.categories{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.category{
  position:relative;
  height:285px;
  border-radius:20px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
  background:#0a2238;
  transition:.35s;
  cursor:pointer;
}

.category:hover{
  transform:translateY(-7px);
  border-color:var(--gold);
  box-shadow:var(--shadow);
}

.category img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.55s;
}

.category:hover img{
  transform:scale(1.08);
}

.category .veil{
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      0deg,
      rgba(2,9,15,.97),
      rgba(2,9,15,.06) 72%
    );

  display:flex;
  flex-direction:column;
  justify-content:end;
  padding:20px;
}

.category h3{
  font-size:20px;
}

.category p{
  font-size:12px;
  color:var(--gold2);
  margin-top:6px;
}

/* INFO */

.info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-top:28px;
}

.info-card{
  background:var(--card);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:24px;
}

.info-card h3{
  color:var(--gold2);
  margin-bottom:10px;
}

.info-card p{
  color:#c8d4df;
  line-height:1.9;
}

/* FOOTER */

.footer{
  margin-top:80px;
  border-top:1px solid var(--border);
  background:#030a11;
  padding:44px 0 18px;
}

.footer-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
}

.footer h3{
  color:var(--gold2);
  margin-bottom:9px;
}

.footer p{
  color:var(--muted);
  line-height:1.9;
}

.copy{
  text-align:center;
  color:#687988;
  border-top:1px solid rgba(255,255,255,.06);
  margin-top:25px;
  padding-top:15px;
  font-size:12px;
}

/* MODAL */

.modal,
.drawer{
  position:fixed;
  inset:0;
  z-index:3000;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(8px);
  display:none;
}

.modal.show,
.drawer.show{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
}

.modal-box{
  width:min(1120px,97vw);
  max-height:92vh;
  overflow:auto;

  background:
    linear-gradient(
      #0c2943,
      #061321
    );

  border:1px solid var(--border);
  border-radius:21px;
  box-shadow:0 30px 100px #000;
}

.modal-head{
  position:sticky;
  top:0;
  z-index:2;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:16px 19px;

  background:rgba(6,19,33,.94);
  backdrop-filter:blur(12px);

  border-bottom:1px solid rgba(255,255,255,.07);
}

.modal-head h2{
  color:var(--gold2);
  font:700 28px Georgia,serif;
}

.close{
  width:41px;
  height:41px;
  border-radius:50%;
  border:1px solid var(--gold);
  background:transparent;
  color:#fff;
  font-size:24px;
}

/* PRODUCTS */

.products{
  padding:18px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.product{
  background:#102d47;
  border:1px solid rgba(255,255,255,.07);
  border-radius:14px;
  overflow:hidden;
  transition:.3s;
}

.product:hover{
  transform:translateY(-4px);
  border-color:var(--gold);
}

.product img{
  width:100%;
  height:155px;
  object-fit:cover;
}

.product-body{
  padding:12px;
}

.product h3{
  font-size:15px;
  line-height:1.45;
  min-height:44px;
}

.product-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:9px;
}

.price{
  color:var(--gold2);
  font-weight:900;
}

.add{
  border:1px solid var(--gold);
  background:transparent;
  color:#fff;
  border-radius:8px;
  padding:7px 9px;
}

.add:hover{
  background:var(--gold);
  color:#111;
}

/* CART */

.drawer{
  justify-content:flex-start!important;
  align-items:stretch!important;
}

.cart{
  width:min(440px,94vw);
  height:100%;
  background:#071827;
  padding:20px;
  overflow:auto;
  box-shadow:0 0 70px #000;
}

html[dir="rtl"] .cart{
  margin-right:auto;
}

html[dir="ltr"] .cart{
  margin-left:auto;
}

.cart h2{
  color:var(--gold2);
  font:700 27px Georgia,serif;
  margin-bottom:12px;
}

.cart-item{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:9px;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:12px 0;
}

.remove{
  border:0;
  background:none;
  color:#ff7777;
  font-size:20px;
}

.empty{
  color:var(--muted);
  padding:30px 0;
}

.checkout{
  width:100%;
  margin-top:16px;
  border:0;
  border-radius:11px;
  padding:13px;
  background:
    linear-gradient(
      135deg,
      var(--gold),
      var(--gold2)
    );
  font-weight:900;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  z-index:5000;

  transform:translate(-50%,20px);
  opacity:0;

  background:var(--gold2);
  color:#111;

  padding:11px 17px;
  border-radius:10px;

  font-weight:900;

  transition:.25s;
  pointer-events:none;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* MOBILE */

@media(max-width:950px){

  .features{
    grid-template-columns:repeat(2,1fr);
  }

  .categories{
    grid-template-columns:repeat(2,1fr);
  }

  .products{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:650px){

  .header-inner{
    min-height:72px;
  }

  .logo img{
    width:52px;
    height:52px;
  }

  .logo-title{
    font-size:21px;
  }

  .logo-sub{
    display:none;
  }

  .hero{
    min-height:610px;
  }

  .hero-content{
    padding:75px 0;
  }

  .hero p{
    font-size:15px;
  }

  .features{
    grid-template-columns:1fr 1fr;
  }

  .categories,
  .info-grid,
  .footer-grid{
    grid-template-columns:1fr;
  }

  .products{
    grid-template-columns:1fr 1fr;
    padding:12px;
  }

  .product img{
    height:130px;
  }

  .section-head{
    display:block;
  }

  .section-head p{
    margin-top:7px;
  }

}

@media(max-width:420px){

  .features{
    grid-template-columns:1fr;
  }

  .products{
    grid-template-columns:1fr;
  }

}
</style>
</head>

let lang =
localStorage.getItem("cm_lang") || "ar";

let cart =
JSON.parse(
localStorage.getItem("cm_cart") || "[]"
);


const $ = id =>
document.getElementById(id);


function applyLanguage(){

const t=T[lang];

document.documentElement.lang=lang;

document.documentElement.dir =
lang==="ar" ? "rtl" : "ltr";


const map={

topbar:t.top,

logoSub:t.sub,

navHome:t.nav[0],

navShop:t.nav[1],

navAbout:t.nav[2],

navContact:t.nav[3],

cartWord:t.cart,

heroBadge:t.badge,

heroTitle:t.title,

heroText:t.text,

heroShop:t.shop,

heroContact:t.contact,

sectionTitle:t.section,

sectionHint:t.hint,

aboutTitle:t.about,

aboutText:t.aboutText,

contactTitle:t.contactTitle,

contactText:t.contactText,

hoursTitle:t.hours,

addressTitle:t.address,

serviceTitle:t.service,

serviceText:t.serviceText,

rights:t.rights,

cartTitle:t.cartTitle,

checkout:t.checkout

};


Object.entries(map).forEach(
([id,value])=>{
$(id).textContent=value;
});


$("hours").innerHTML=t.hoursText;

$("search").placeholder=t.search;


for(let i=1;i<=4;i++){

$("f"+i).textContent =
t.f[i-1][0];

$("f"+i+"s").textContent =
t.f[i-1][1];

}


$("cartCount").textContent =
cart.length;


renderCategories(
$("search").value
);

renderCart();

}


function categoryName(c){

return c[lang];

}


function itemName(item){

return item[
lang==="ar"
?0
:lang==="de"
?1
:2
];

}


/* ================================
   الأقسام
================================ */

function renderCategories(q=""){

q=q.trim().toLowerCase();


$("categories").innerHTML =
data.map((c,i)=>{

const searchable =
(
categoryName(c)+" "+
c.items.map(itemName).join(" ")
).toLowerCase();


if(q && !searchable.includes(q))
return "";


return `

<article
class="category"
onclick="openCategory(${i})">

<img
src="${IMG[c.key]}"
loading="lazy"
alt="${safe(categoryName(c))}">

<div class="veil">

<h3>
${safe(categoryName(c))}
</h3>

<p>
${T[lang].count} →
</p>

</div>

</article>

`;

}).join("") ||

`<div style="color:var(--muted);padding:20px">
No results
</div>`;

}


/* ================================
   فتح المنتجات
================================ */

function openCategory(i){

const c=data[i];

$("modalTitle").textContent =
categoryName(c);


$("products").innerHTML =
c.items.map((item,j)=>`

<article class="product">

<img
src="${IMG[c.key]}"
loading="lazy"
alt="${safe(itemName(item))}">

<div class="product-body">

<h3>
${safe(itemName(item))}
</h3>

<div class="product-row">

<span class="price">
${item[3]}
</span>

<button
class="add"
onclick="addToCart(${i},${j})">

+ ${T[lang].add}

</button>

</div>

</div>

</article>

`).join("");


$("modal").classList.add("show");

document.body.classList.add(
"no-scroll"
);

}


function closeModal(){

$("modal").classList.remove("show");

document.body.classList.remove(
"no-scroll"
);

}


/* ================================
   السلة
================================ */

function addToCart(ci,pi){

cart.push({
ci,
pi
});

saveCart();

showToast(
T[lang].added
);

}


function saveCart(){

localStorage.setItem(
"cm_cart",
JSON.stringify(cart)
);

$("cartCount").textContent =
cart.length;

renderCart();

}


function openCart(){

$("drawer").classList.add("show");

renderCart();

}


function closeCart(){

$("drawer").classList.remove("show");

}


function renderCart(){

if(!cart.length){

$("cartItems").innerHTML = `

<div class="empty">
${T[lang].empty}
</div>

`;

return;

}


$("cartItems").innerHTML =
cart.map((x,i)=>{

let c=data[x.ci];

let it=c.items[x.pi];


return `

<div class="cart-item">

<span>
${safe(itemName(it))}
</span>

<b class="price">
${it[3]}
</b>

<button
class="remove"
onclick="removeItem(${i})">
×
</button>

</div>

`;

}).join("");

}


function removeItem(i){

cart.splice(i,1);

saveCart();

}


/* ================================
   WhatsApp
================================ */

function sendOrder(){

if(!cart.length){

return showToast(
T[lang].empty
);

}


/*
   ⚠️ ضع رقم WhatsApp الحقيقي
   هنا.

   مثال ألمانيا:
   491701234567

   بدون + أو مسافات.
*/

const WHATSAPP_NUMBER =
"491234567890";


const order =
cart.map(x=>{

let it =
data[x.ci].items[x.pi];

return `
${itemName(it)} — ${it[3]}
`;

}).join("\n");


const message =
encodeURIComponent(

`Caesar Markt Neumünster

${order}

${
lang==="ar"
?
"أرغب في تأكيد الطلب والتوصيل."
:
lang==="de"
?
"Ich möchte die Bestellung und Lieferung bestätigen."
:
"Siparişi ve teslimatı onaylamak istiyorum."
}`

);


window.open(
`https://wa.me/${WHATSAPP_NUMBER}?text=${message}`,
"_blank"
);

}


/* ================================
   الأدوات
================================ */

function scrollToId(id){

$(id).scrollIntoView({

behavior:"smooth",

block:"start"

});

}


function goTop(e){

e.preventDefault();

window.scrollTo({

top:0,

behavior:"smooth"

});

}


function safe(s){

return String(s).replace(
/[&<>"']/g,
m=>({

"&":"&amp;",

"<":"&lt;",

">":"&gt;",

'"':"&quot;",

"'":"&#039;"

}[m])

);

}


function showToast(s){

$("toast").textContent=s;

$("toast").classList.add("show");

clearTimeout(
window.toastTimer
);

window.toastTimer =
setTimeout(
()=>
$("toast").classList.remove("show"),
1700
);

}

================================ */

$("language").value=lang;


$("language").addEventListener(
"change",
e=>{

lang=e.target.value;

localStorage.setItem(
"cm_lang",
lang
);

applyLanguage();

}
);


$("search").addEventListener(
"input",
e=>
renderCategories(
e.target.value
)
);


document.addEventListener(
"keydown",
e=>{

if(e.key==="Escape"){

closeModal();

closeCart();

}

}
);


/* تشغيل الموقع */

applyLanguage();
